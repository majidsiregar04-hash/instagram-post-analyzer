<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Instagram Comment Analysis Report</title>
<style>
  @page {
    size: A4;
    margin: 15mm 12mm;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #1a1a1a;
    font-size: 11pt;
    line-height: 1.5;
    background: #fff;
    padding: 20px 30px;
  }
  #loading {
    text-align: center;
    padding: 60px 0;
    color: #888;
    font-size: 14pt;
  }

  /* Header */
  .report-header {
    text-align: center;
    border-bottom: 3px solid #833ab4;
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .report-header h1 {
    font-size: 22pt;
    font-weight: 700;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .report-header .meta {
    font-size: 10pt;
    color: #666;
  }
  .report-header .meta strong { color: #333; }

  /* Sections */
  .section {
    margin-bottom: 20px;
    break-inside: avoid;
  }
  .section-title {
    font-size: 13pt;
    font-weight: 700;
    color: #333;
    border-bottom: 2px solid #e0e0e0;
    padding-bottom: 4px;
    margin-bottom: 10px;
  }

  /* Summary box */
  .summary-box {
    background: #f8f8fa;
    border-left: 4px solid #833ab4;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 11pt;
    color: #333;
  }

  /* Sentiment */
  .sentiment-grid {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }
  .sentiment-card {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    border-radius: 8px;
    border: 1px solid #e0e0e0;
  }
  .sentiment-card .pct {
    font-size: 24pt;
    font-weight: 700;
    line-height: 1.2;
  }
  .sentiment-card .lbl {
    font-size: 10pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .sentiment-card.positive { border-color: #4caf50; }
  .sentiment-card.positive .pct { color: #2e7d32; }
  .sentiment-card.positive .lbl { color: #4caf50; }
  .sentiment-card.negative { border-color: #f44336; }
  .sentiment-card.negative .pct { color: #c62828; }
  .sentiment-card.negative .lbl { color: #f44336; }
  .sentiment-card.neutral { border-color: #ff9800; }
  .sentiment-card.neutral .pct { color: #e65100; }
  .sentiment-card.neutral .lbl { color: #ff9800; }

  /* Bar visual */
  .sentiment-bar-container {
    display: flex;
    height: 12px;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 10px;
    background: #eee;
  }
  .bar-pos { background: #4caf50; }
  .bar-neg { background: #f44336; }
  .bar-neu { background: #ff9800; }

  /* Topics */
  .tags { margin-top: 6px; }
  .tag {
    display: inline-block;
    background: #f0f0f5;
    border: 1px solid #d0d0d8;
    border-radius: 16px;
    padding: 4px 14px;
    margin: 3px 4px 3px 0;
    font-size: 10pt;
    color: #444;
  }

  /* Highlights */
  .highlight-card {
    border-left: 4px solid #833ab4;
    padding: 8px 14px;
    margin-bottom: 10px;
    background: #faf8fc;
    border-radius: 0 4px 4px 0;
  }
  .highlight-user {
    font-weight: 700;
    color: #833ab4;
    font-size: 10pt;
  }
  .highlight-text {
    color: #333;
    margin-top: 2px;
    font-size: 10.5pt;
  }
  .reason {
    color: #888;
    font-style: italic;
    font-size: 9.5pt;
    margin-top: 4px;
  }

  /* Comment tables */
  .comment-section-header {
    font-size: 12pt;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 4px;
    margin-bottom: 6px;
    color: #fff;
  }
  .comment-section-header.positive-hdr { background: #4caf50; }
  .comment-section-header.negative-hdr { background: #f44336; }
  .comment-section-header.neutral-hdr { background: #ff9800; }

  .comment-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
    font-size: 9.5pt;
  }
  .comment-table thead th {
    background: #f5f5f5;
    padding: 6px 8px;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid #ddd;
    font-size: 9pt;
    color: #555;
  }
  .comment-table tbody tr {
    border-bottom: 1px solid #eee;
  }
  .comment-table tbody tr:nth-child(even) {
    background: #fafafa;
  }
  .comment-table td {
    padding: 5px 8px;
    vertical-align: top;
  }
  .col-num { width: 35px; text-align: center; color: #999; }
  .col-user { width: 110px; font-weight: 600; color: #833ab4; white-space: nowrap; }
  .col-text { color: #333; }

  .tbl-positive thead th { border-bottom-color: #4caf50; }
  .tbl-negative thead th { border-bottom-color: #f44336; }
  .tbl-neutral thead th { border-bottom-color: #ff9800; }

  .muted { color: #999; font-style: italic; }

  /* Print button */
  .no-print { text-align: center; margin: 20px 0; }
  .print-btn {
    padding: 10px 32px;
    font-size: 13pt;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .print-btn:hover { opacity: 0.9; }

  @media print {
    body { padding: 0; }
    .no-print { display: none !important; }
    #loading { display: none !important; }
    .section { break-inside: avoid; }
    .comment-table tr { break-inside: avoid; }
    .highlight-card { break-inside: avoid; }
  }
</style>
</head>
<body>

<div id="loading">Memuat laporan...</div>
<div id="report" style="display:none;"></div>

<script>
function escapeHTML(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function buildCommentTable(list, colorClass) {
  if (list.length === 0) return '<p class="muted">Tidak ada komentar dalam kategori ini.</p>';
  let rows = '';
  for (let i = 0; i < list.length; i++) {
    rows += '<tr><td class="col-num">' + (i + 1) + '</td>'
      + '<td class="col-user">@' + escapeHTML(list[i].username) + '</td>'
      + '<td class="col-text">' + escapeHTML(list[i].text) + '</td></tr>';
  }
  return '<table class="comment-table ' + colorClass + '">'
    + '<thead><tr><th class="col-num">No</th><th class="col-user">User</th><th class="col-text">Komentar</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table>';
}

chrome.storage.local.get(['reportData'], function(result) {
  const data = result.reportData;
  if (!data) {
    document.getElementById('loading').textContent = 'Tidak ada data laporan. Jalankan analisis terlebih dahulu.';
    return;
  }

  const analysis = data.analysis;
  const comments = data.comments;
  const categorized = data.categorized;
  const sentPct = analysis.sentimen || {};

  const now = new Date();
  const dateStr = now.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
  const timeStr = now.toLocaleTimeString('id-ID');

  // Build highlights
  let highlightsHTML = '';
  if (analysis.komentar_menarik && analysis.komentar_menarik.length > 0) {
    for (const h of analysis.komentar_menarik) {
      const alasan = h.alasan ? '<div class="reason">' + escapeHTML(h.alasan) + '</div>' : '';
      highlightsHTML += '<div class="highlight-card">'
        + '<div class="highlight-user">@' + escapeHTML(h.username || 'anonim') + '</div>'
        + '<div class="highlight-text">' + escapeHTML(h.teks || h.text || '') + '</div>'
        + alasan + '</div>';
    }
  } else {
    highlightsHTML = '<p class="muted">Tidak ada komentar menarik</p>';
  }

  // Build topics
  let topicsHTML = '';
  if (analysis.topik && analysis.topik.length > 0) {
    topicsHTML = analysis.topik.map(function(t) { return '<span class="tag">' + escapeHTML(t) + '</span>'; }).join('');
  } else {
    topicsHTML = '<p class="muted">Tidak ada topik terdeteksi</p>';
  }

  const reportEl = document.getElementById('report');
  reportEl.innerHTML = ''
    + '<div class="report-header">'
    + '  <h1>Instagram Comment Analysis</h1>'
    + '  <div class="meta"><strong>' + dateStr + '</strong> &nbsp;|&nbsp; ' + timeStr + ' &nbsp;|&nbsp; <strong>' + comments.length + '</strong> komentar dianalisis</div>'
    + '</div>'

    + '<div class="section">'
    + '  <div class="section-title">Ringkasan</div>'
    + '  <div class="summary-box">' + escapeHTML(analysis.ringkasan || '-') + '</div>'
    + '</div>'

    + '<div class="section">'
    + '  <div class="section-title">Sentimen</div>'
    + '  <div class="sentiment-grid">'
    + '    <div class="sentiment-card positive"><div class="pct">' + (sentPct.positif || 0) + '%</div><div class="lbl">Positif</div></div>'
    + '    <div class="sentiment-card negative"><div class="pct">' + (sentPct.negatif || 0) + '%</div><div class="lbl">Negatif</div></div>'
    + '    <div class="sentiment-card neutral"><div class="pct">' + (sentPct.netral || 0) + '%</div><div class="lbl">Netral</div></div>'
    + '  </div>'
    + '  <div class="sentiment-bar-container">'
    + '    <div class="bar-pos" style="width:' + (sentPct.positif || 0) + '%"></div>'
    + '    <div class="bar-neg" style="width:' + (sentPct.negatif || 0) + '%"></div>'
    + '    <div class="bar-neu" style="width:' + (sentPct.netral || 0) + '%"></div>'
    + '  </div>'
    + '</div>'

    + '<div class="section">'
    + '  <div class="section-title">Topik Utama</div>'
    + '  <div class="tags">' + topicsHTML + '</div>'
    + '</div>'

    + '<div class="section">'
    + '  <div class="section-title">Komentar Menarik</div>'
    + '  ' + highlightsHTML
    + '</div>'

    + '<div class="section">'
    + '  <div class="section-title">Komentar Positif (' + categorized.positif.length + ')</div>'
    + '  <div class="comment-section-header positive-hdr">Positif &mdash; ' + categorized.positif.length + ' komentar</div>'
    + '  ' + buildCommentTable(categorized.positif, 'tbl-positive')
    + '</div>'

    + '<div class="section">'
    + '  <div class="section-title">Komentar Negatif (' + categorized.negatif.length + ')</div>'
    + '  <div class="comment-section-header negative-hdr">Negatif &mdash; ' + categorized.negatif.length + ' komentar</div>'
    + '  ' + buildCommentTable(categorized.negatif, 'tbl-negative')
    + '</div>'

    + '<div class="section">'
    + '  <div class="section-title">Komentar Netral (' + categorized.netral.length + ')</div>'
    + '  <div class="comment-section-header neutral-hdr">Netral &mdash; ' + categorized.netral.length + ' komentar</div>'
    + '  ' + buildCommentTable(categorized.netral, 'tbl-neutral')
    + '</div>'

    + '<div class="no-print">'
    + '  <button class="print-btn" onclick="window.print()">Cetak / Save as PDF</button>'
    + '</div>';

  document.getElementById('loading').style.display = 'none';
  reportEl.style.display = 'block';

  // Auto-trigger print dialog after render
  setTimeout(function() { window.print(); }, 800);
});
</script>
</body>
</html>
