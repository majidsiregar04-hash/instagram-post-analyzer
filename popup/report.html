<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Instagram Comment Analysis Report</title>
  <style>
    @page { size: A4; margin: 15mm 12mm; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #1a1a1a; font-size: 11pt; line-height: 1.5; background: #fff; padding: 20px 30px;
    }
    @media print { body { padding: 0; } .no-print { display: none !important; } }

    .header { text-align: center; border-bottom: 3px solid #833ab4; padding-bottom: 16px; margin-bottom: 24px; }
    .header h1 { font-size: 22pt; font-weight: 700; color: #833ab4; margin-bottom: 6px; }
    .header .meta { font-size: 10pt; color: #666; }
    .header .meta strong { color: #333; }

    .section { margin-bottom: 20px; }
    .section-title { font-size: 13pt; font-weight: 700; color: #333; border-bottom: 2px solid #e0e0e0; padding-bottom: 4px; margin-bottom: 10px; }

    .summary-box { background: #f8f8fa; border-left: 4px solid #833ab4; padding: 12px 16px; border-radius: 4px; color: #333; }

    .sentiment-grid { display: flex; gap: 8px; margin-bottom: 10px; }
    .sentiment-card { flex: 1; text-align: center; padding: 12px 8px; border-radius: 8px; }
    .sentiment-card.positive { border: 1px solid #4caf50; }
    .sentiment-card.negative { border: 1px solid #f44336; }
    .sentiment-card.neutral { border: 1px solid #ff9800; }
    .sentiment-card .pct { font-size: 24pt; font-weight: 700; }
    .sentiment-card.positive .pct { color: #2e7d32; }
    .sentiment-card.negative .pct { color: #c62828; }
    .sentiment-card.neutral .pct { color: #e65100; }
    .sentiment-card .label { font-size: 10pt; font-weight: 600; text-transform: uppercase; }
    .sentiment-card.positive .label { color: #4caf50; }
    .sentiment-card.negative .label { color: #f44336; }
    .sentiment-card.neutral .label { color: #ff9800; }

    .sentiment-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #eee; }
    .sentiment-bar .seg-positive { background: #4caf50; }
    .sentiment-bar .seg-negative { background: #f44336; }
    .sentiment-bar .seg-neutral { background: #ff9800; }

    .topic-tag { display: inline-block; background: #f0f0f5; border: 1px solid #d0d0d8; border-radius: 16px; padding: 4px 14px; margin: 3px 4px 3px 0; font-size: 10pt; color: #444; }

    .highlight { border-left: 4px solid #833ab4; padding: 8px 14px; margin-bottom: 10px; background: #faf8fc; border-radius: 0 4px 4px 0; }
    .highlight .user { font-weight: 700; color: #833ab4; font-size: 10pt; }
    .highlight .text { color: #333; margin-top: 2px; font-size: 10.5pt; }
    .highlight .reason { color: #888; font-style: italic; font-size: 9.5pt; margin-top: 4px; }

    .cat-header { font-size: 12pt; font-weight: 700; padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; color: #fff; }
    .cat-header.positive { background: #4caf50; }
    .cat-header.negative { background: #f44336; }
    .cat-header.neutral { background: #ff9800; }

    table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin-bottom: 16px; }
    th { background: #f5f5f5; padding: 6px 8px; text-align: left; font-weight: 600; font-size: 9pt; color: #555; }
    td { padding: 5px 8px; }
    tr:nth-child(even) { background: #fafafa; }
    tr { border-bottom: 1px solid #eee; }
    td.num { width: 35px; text-align: center; color: #999; }
    td.user { width: 110px; font-weight: 600; color: #833ab4; white-space: nowrap; }
    td.comment { color: #333; }

    .empty { color: #999; font-style: italic; }

    .print-btn-wrap { text-align: center; margin: 20px 0; }
    .print-btn {
      padding: 10px 32px; font-size: 13pt; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      border: none; border-radius: 8px; cursor: pointer;
    }
    .print-btn:hover { opacity: 0.9; }

    .loading { text-align: center; padding: 60px 0; color: #666; font-size: 14pt; }
  </style>
</head>
<body>
  <div id="loading" class="loading">Memuat laporan...</div>
  <div id="report" style="display:none"></div>

  <script src="report.js"></script>
</body>
</html>
